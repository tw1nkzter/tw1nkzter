name: Refresh profile widgets

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/generate_widgets.py"
      - ".github/workflows/widgets.yml"

permissions:
  contents: write

jobs:
  widgets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate repository and profile widgets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python .github/scripts/generate_widgets.py

      - name: Commit refreshed widgets
        shell: bash
        run: |
          if git diff --quiet -- assets/widgets; then
            echo "Widgets are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/widgets
          git commit -m "chore: refresh profile widgets"
          git push
